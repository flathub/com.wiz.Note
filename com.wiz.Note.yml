app-id: com.wiz.Note
base: io.qt.qtwebengine.BaseApp
base-version: '5.15-23.08'
runtime: org.kde.Platform
runtime-version: '5.15-23.08'
sdk: org.kde.Sdk
separate-locales: false
command: WizNote
finish-args:
  - '--share=network'
  - '--share=ipc'
  - '--socket=x11'
  - '--socket=wayland'
  - '--device=dri'
  - '--persist=.wiznote'
  - '--filesystem=xdg-documents'
  - '--talk-name=org.kde.StatusNotifierWatcher'
  - '--talk-name=com.canonical.indicator.application'
  # for single instance to work
  - '--env=TMPDIR=/var/tmp'
rename-icon: wiznote
rename-desktop-file: wiznote.desktop
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: WizNote
    buildsystem: cmake-ninja
    build-commands:
      - install -D -m0644 -t /app/share/metainfo/ com.wiz.Note.appdata.xml
    sources:
      - type: git
        url: 'https://github.com/WizTeam/WizQTClient.git'
        branch: '2.8.8'
        commit: '7067bcfc421edce932aa3144ef2d1d631f27595a'
      - type: file
        path: com.wiz.Note.appdata.xml
